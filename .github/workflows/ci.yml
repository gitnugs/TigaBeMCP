name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Izin menulis package ke GHCR
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Owner repo menentukan namespace GHCR (huruf kecil). Contoh: gitnugs
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/tigabe-mcp

jobs:
  # ---------------------------------------------------------------- CI
  ci:
    name: Compile & smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python syntax check (semua .py)
        run: |
          find . -name "*.py" -not -path "./.venv/*" -print0 \
            | xargs -0 -n1 python -m py_compile

      # Import tidak butuh Qdrant/MinIO hidup; cukup cek modul & kontrak fungsi.
      - name: Smoke import (tanpa service eksternal)
        env:
          QDRANT_URL: "http://127.0.0.1:1"
          QDRANT_API_KEY: "dummy"
          MINIO_PUBLIC_ENDPOINT: "localhost"
          MINIO_ACCESS_KEY: "dummy"
          MINIO_SECRET_KEY: "dummy"
          MINIO_BUCKET: "dummy"
        run: |
          python - <<'PY'
          import importlib.util, pathlib
          for mod in ("auth", "search", "storage", "knowledge", "audit"):
              spec = importlib.util.find_spec(mod)
              assert spec is not None, f"modul {mod} belum ada"
          print("CI smoke OK")
          PY


  # ---------------------------------------------------------------- BUILD + PUSH
  # Build DUA image di GitHub Actions (internet tersedia -> model E5 ter-bake),
  # lalu push ke GHCR. Server tinggal `docker compose pull && up -d`
  # (TIDAK butuh akses huggingface.co di server).
  build-push:
    name: Build & push ke GHCR
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image mcp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_BASE }}-mcp:main
            ${{ env.IMAGE_BASE }}-mcp:sha-${{ github.sha }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

      - name: Build & push image embed
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.embed
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE_BASE }}-embed:main
            ${{ env.IMAGE_BASE }}-embed:sha-${{ github.sha }}
          cache-from: type=gha,scope=embed
          cache-to: type=gha,mode=max,scope=embed


  # ---------------------------------------------------------------- CD
  deploy:
    name: Deploy ke server (pull GHCR + up)
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pasang kunci SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Rsync file konfigurasi (tanpa .env/sensitif)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_REMOTE: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "${PORT:-22}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Hanya kirim berkas yang perlu untuk `docker compose -f docker-compose.prod.yml pull`
          rsync -avz \
            -e "ssh -p ${PORT:-22}" \
            --exclude '.venv' --exclude '__pycache__' --exclude '.git' \
            --exclude '.env' --exclude 'roles.json' --exclude 'login_users.json' \
            --exclude 'audit_log.json' --exclude 'runtime-data' \
            docker-compose.prod.yml deploy/ \
            "${USER}@${HOST}:${PATH_REMOTE}/"

      - name: Logout GHCR di server lalu pull & up
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_REMOTE: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ secrets.DEPLOY_GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.DEPLOY_GHCR_TOKEN }}
        run: |
          set -euo pipefail
          # Kredensial GHCR diteruskan sebagai env ke bash jarak jauh (bukan di-
          # tulis di file/heredoc) agar tidak bocor ke Logs/History Actions.
          ssh -p "${PORT:-22}" "${USER}@${HOST}" \
            "PATH_REMOTE='${PATH_REMOTE}' GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" <<'REMOTE'
            set -euo pipefail
            cd "${PATH_REMOTE}"

            # Login ke GHCR pakai PAT (read:packages). Bila image sudah PUBLIC,
            # `docker pull` anonim cukup dan baris ini boleh dihapus.
            if [ -n "${GHCR_TOKEN}" ] && [ -n "${GHCR_USER}" ]; then
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi

            if command -v docker >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi
            "$DC" -f docker-compose.prod.yml pull
            "$DC" -f docker-compose.prod.yml up -d

            sleep 5
            "$DC" -f docker-compose.prod.yml ps
            "$DC" -f docker-compose.prod.yml logs --tail=30 mcp embed || true
          REMOTE